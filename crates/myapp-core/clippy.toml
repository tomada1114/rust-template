# Core's extra bans: I/O, time, environment, and processes reach core only
# through ports. This file replaces the root clippy.toml for this crate, so it repeats
# the root's two settings.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-macros = [
  { path = "std::println", reason = "core never prints; log with tracing" },
  { path = "std::eprintln", reason = "core never prints; log with tracing" },
  { path = "std::print", reason = "core never prints; log with tracing" },
  { path = "std::eprint", reason = "core never prints; log with tracing" },
  { path = "std::dbg", reason = "leftover debugging" },
]
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "inject time through the Clock port" },
  { path = "std::time::Instant::now", reason = "inject time through the Clock port" },
  { path = "std::time::SystemTime::elapsed", reason = "inject time through the Clock port" },
  { path = "std::time::Instant::elapsed", reason = "inject time through the Clock port" },
  { path = "std::env::var", reason = "configuration reaches core as arguments" },
  { path = "std::env::var_os", reason = "configuration reaches core as arguments" },
  { path = "std::env::vars", reason = "configuration reaches core as arguments" },
  { path = "std::env::vars_os", reason = "configuration reaches core as arguments" },
  { path = "std::env::args", reason = "configuration reaches core as arguments" },
  { path = "std::env::args_os", reason = "configuration reaches core as arguments" },
  { path = "std::env::current_dir", reason = "paths reach core as arguments" },
  { path = "std::env::temp_dir", reason = "paths reach core as arguments" },
  { path = "std::env::current_exe", reason = "paths reach core as arguments" },
  { path = "std::env::home_dir", reason = "paths reach core as arguments" },
  { path = "std::env::set_current_dir", reason = "core never changes the process's environment" },
  { path = "std::env::set_var", reason = "core never changes the process's environment" },
  { path = "std::env::remove_var", reason = "core never changes the process's environment" },
  { path = "std::thread::sleep", reason = "core never waits; the shell schedules" },
  { path = "std::thread::park_timeout", reason = "core never waits; the shell schedules" },
  { path = "std::thread::available_parallelism", reason = "facts about the machine reach core as arguments" },
  { path = "std::process::id", reason = "facts about the process reach core as arguments" },
  { path = "std::os::unix::process::parent_id", reason = "facts about the process reach core as arguments" },
  # std::thread::scope stays allowed: a scope joins every thread before it returns, so
  # core stays synchronous and nothing outlives the call (core's concurrency test uses it).
  { path = "std::thread::spawn", reason = "core never starts a thread; the shell schedules" },
  { path = "std::thread::Builder::spawn", reason = "core never starts a thread; the shell schedules" },
  { path = "std::process::exit", reason = "core returns an error; the shell or the CLI decides to exit" },
  { path = "std::process::abort", reason = "core returns an error; the shell or the CLI decides to exit" },
  { path = "std::io::stdin", reason = "I/O goes through a port" },
  { path = "std::io::stdout", reason = "core never prints; log with tracing" },
  { path = "std::io::stderr", reason = "core never prints; log with tracing" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "the network goes through a port" },
  { path = "std::fs::canonicalize", reason = "I/O goes through a port" },
  { path = "std::fs::copy", reason = "I/O goes through a port" },
  { path = "std::fs::create_dir", reason = "I/O goes through a port" },
  { path = "std::fs::create_dir_all", reason = "I/O goes through a port" },
  { path = "std::fs::exists", reason = "I/O goes through a port" },
  { path = "std::fs::hard_link", reason = "I/O goes through a port" },
  { path = "std::fs::metadata", reason = "I/O goes through a port" },
  { path = "std::fs::read", reason = "I/O goes through a port" },
  { path = "std::fs::read_dir", reason = "I/O goes through a port" },
  { path = "std::fs::read_link", reason = "I/O goes through a port" },
  { path = "std::fs::read_to_string", reason = "I/O goes through a port" },
  { path = "std::fs::remove_dir", reason = "I/O goes through a port" },
  { path = "std::fs::remove_dir_all", reason = "I/O goes through a port" },
  { path = "std::fs::remove_file", reason = "I/O goes through a port" },
  { path = "std::fs::rename", reason = "I/O goes through a port" },
  { path = "std::fs::set_permissions", reason = "I/O goes through a port" },
  { path = "std::fs::soft_link", reason = "I/O goes through a port" },
  { path = "std::fs::symlink_metadata", reason = "I/O goes through a port" },
  { path = "std::fs::write", reason = "I/O goes through a port" },
  { path = "std::os::unix::fs::symlink", reason = "I/O goes through a port" },
  { path = "std::os::unix::fs::chown", reason = "I/O goes through a port" },
  { path = "std::os::unix::fs::fchown", reason = "I/O goes through a port" },
  { path = "std::os::unix::fs::lchown", reason = "I/O goes through a port" },
  { path = "std::os::unix::fs::chroot", reason = "core never changes the process's environment" },
  { path = "std::path::Path::exists", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::try_exists", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::metadata", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::symlink_metadata", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::read_dir", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::read_link", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::canonicalize", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::is_file", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::is_dir", reason = "I/O goes through a port; a path is only data in core" },
  { path = "std::path::Path::is_symlink", reason = "I/O goes through a port; a path is only data in core" },
]
disallowed-types = [
  { path = "std::process::Command", reason = "processes are started by platform adapters" },
  { path = "std::fs::File", reason = "I/O goes through a port" },
  { path = "std::fs::OpenOptions", reason = "I/O goes through a port" },
  { path = "std::fs::DirBuilder", reason = "I/O goes through a port" },
  { path = "std::net::TcpStream", reason = "the network goes through a port" },
  { path = "std::net::TcpListener", reason = "the network goes through a port" },
  { path = "std::net::UdpSocket", reason = "the network goes through a port" },
  { path = "std::os::unix::net::UnixStream", reason = "the network goes through a port" },
  { path = "std::os::unix::net::UnixListener", reason = "the network goes through a port" },
  { path = "std::os::unix::net::UnixDatagram", reason = "the network goes through a port" },
]
