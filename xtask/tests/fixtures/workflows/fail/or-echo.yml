# A gate run as `just test-core || echo skipped`: the echo succeeds, so the step does.
expect:
  workflow-hygiene: [ERR_CHECK_WORKFLOW_FAIL_OPEN]
  just-check-matches-ci: [ERR_CHECK_JUST_CI_DIVERGED]
edits:
  - file: .github/workflows/ci.yml
    from: "      - run: just test-core\n"
    to: "      - run: just test-core || echo skipped\n"
