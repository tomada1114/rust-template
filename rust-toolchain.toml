# The one Rust pin. rustup reads this file and installs the toolchain on the next
# `cargo` call; mise.toml lists no `rust` tool, so `mise install` never touches Rust.
# Renovate's `rust-toolchain` manager opens the bump PRs.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt", "llvm-tools"]
targets = ["aarch64-apple-darwin"]
profile = "minimal"
