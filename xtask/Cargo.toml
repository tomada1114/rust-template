[package]
name = "xtask"
description = "The repository's automation, run as `cargo xtask <task>`: the staged guard, the hook check, the edit formatter, the clippy guard, the skills mirror, and temp pruning. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# A path here, not in [workspace.dependencies]: the bootstrap check holds every path there
# to a renamed template crate under crates/.
xtask-guard = { path = "guard" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
