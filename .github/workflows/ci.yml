name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is keyed by
  # commit instead, so two quick merges neither cancel one another nor leave main's
  # tip without a finished run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner's default `bash -e` hides a failure inside a pipeline and expands an unset
# variable to the empty string; every step here fails closed instead.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  rust-core:
    # Job names are the ruleset's required status contexts (.github/rulesets/main.json):
    # rename both together.
    name: Rust Core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust itself comes from rust-toolchain.toml through the runner's rustup.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: just github:taiki-e/cargo-llvm-cov aqua:nextest-rs/nextest/cargo-nextest github:EmbarkStudios/cargo-deny github:Boshen/cargo-shear

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      # Only the crates that need no WebKitGTK: the Tauri crate is built and linted on
      # the macOS job.
      - name: Clippy (Linux-buildable crates)
        run: cargo clippy --locked -p myapp-core -p myapp-test-support -p myapp-platform -p myapp-cli --all-targets -- -D warnings

      - name: Core tests with coverage floors, doctests, and the Linux-buildable crates' tests
        run: just test-core

      - name: IPC bindings are up to date
        run: |
          just bindings
          drift="$(git status --porcelain -- ui/src/ipc/generated)"
          if [[ -n "$drift" ]]; then
            printf '%s\n' "$drift"
            echo "::error::ui/src/ipc/generated/ differs from core's types. Run \`just bindings\` and commit the result."
            exit 1
          fi

      - name: cargo deny
        run: cargo deny check

      - name: cargo shear
        run: cargo shear

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just

      - name: Enable pnpm (the version package.json's packageManager names)
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: UI tests with coverage floors
        run: just test-ui

  repo-lint:
    name: Repo Lint & Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just typos actionlint shellcheck

      - name: Enable pnpm (the version package.json's packageManager names)
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typos
        run: typos

      - name: Actionlint
        run: actionlint

      - name: Script tests with coverage floors
        run: just test-scripts

  macos:
    name: macOS Build & Smoke
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just aqua:nextest-rs/nextest/cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build fails when a bundle.externalBin file is missing, so the helper is
      # built before anything compiles the Tauri crate.
      - name: Build the sidecar helper
        run: just sidecar

      - name: Clippy (whole workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: macOS tests (tauri::test commands, real adapters)
        run: just test-macos

      - name: Build the debug app bundle
        run: just build

      - name: Launch smoke (release bundle, signature, entitlements, sidecar, smoke mode)
        run: just smoke

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor is pinned in mise.toml (Renovate bumps it), not taken from a third-party action.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: zizmor

      - name: zizmor
        env:
          # Read-only: lets the online audits (known-vulnerable actions, impostor commits) run.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .
