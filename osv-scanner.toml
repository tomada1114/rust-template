# OSV-Scanner ignores, under the same advisory scope as deny.toml's [graph] targets:
# - an advisory for a crate absent from `cargo tree --target aarch64-apple-darwin` (it
#   never ships in this macOS-only app) may be ignored, with its reason;
# - an advisory for a shipped crate is fixed by updating; only when no fixed release
#   exists may it be ignored, with its reason and a tracking issue.
# Every entry expires after 90 days and is recorded in docs/template/implementation-notes.md.

# Linux only: glib is part of Tauri's GTK stack (muda -> gtk -> atk -> glib), absent
# from the aarch64-apple-darwin tree.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-27T00:00:00Z
reason = "glib is Linux-only (Tauri's GTK stack); absent from cargo tree --target aarch64-apple-darwin"

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2026-12-27T00:00:00Z
reason = "alias of RUSTSEC-2024-0429 (glib, Linux-only)"

