[package]
name = "myapp-core"
description = "MyApp's domain logic: state, rules, and the ports adapters implement. No OS APIs, no terminal, no direct I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only platform-neutral crates belong here. A harness check fails if this crate's normal
# or build dependency closure reaches a crate on the boundary list in AGENTS.md ›
# Architecture: the macOS binding crates (objc2*, core-foundation*,
# security-framework*), the desktop-GUI crates, or myapp-platform. clap, ratatui, and
# crossterm belong to the binary too, but only review keeps them out of here.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
myapp-test-support = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
