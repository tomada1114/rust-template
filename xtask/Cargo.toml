[package]
name = "xtask"
description = "The repository's automation, run as `cargo xtask <task>`: the staged guard, the hook check, the edit formatter, the clippy guard, the skills mirror, temp pruning, the harness checks, and the GitHub label and ruleset sync. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
regex = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# A path here, not in [workspace.dependencies]: the bootstrap check holds every path there
# to a renamed template crate under crates/.
xtask-guard = { path = "guard" }
yaml-rust2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
