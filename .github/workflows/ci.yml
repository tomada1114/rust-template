name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is keyed by
  # commit instead, so two quick merges neither cancel one another nor leave main's
  # tip without a finished run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner's default `bash -e` hides a failure inside a pipeline and expands an unset
# variable to the empty string; every step here fails closed instead.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  rust-core:
    # Job names are the ruleset's required status contexts (.github/rulesets/main.json):
    # rename both together.
    name: Rust Core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust itself comes from rust-toolchain.toml through the runner's rustup.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: just github:taiki-e/cargo-llvm-cov aqua:nextest-rs/nextest/cargo-nextest github:EmbarkStudios/cargo-deny github:Boshen/cargo-shear

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      # Only the crates that need no WebKitGTK: the Tauri crate is built and linted on
      # the macOS job.
      - name: Clippy (Linux-buildable crates)
        run: cargo clippy --locked -p myapp-core -p myapp-test-support -p myapp-platform -p myapp-cli --all-targets -- -D warnings

      - name: Core tests with coverage floors, doctests, and the Linux-buildable crates' tests
        run: just test-core

      - name: IPC bindings are up to date
        run: |
          just bindings
          drift="$(git status --porcelain -- ui/src/ipc/generated)"
          if [[ -n "$drift" ]]; then
            printf '%s\n' "$drift"
            echo "::error::ui/src/ipc/generated/ differs from core's types. Run \`just bindings\` and commit the result."
            exit 1
          fi

      - name: cargo deny
        run: cargo deny --locked check

      - name: cargo shear
        run: cargo shear --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just

      - name: Enable pnpm (the version package.json's packageManager names)
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: UI tests with coverage floors
        run: just test-ui

  repo-lint:
    name: Repo Lint & Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just typos actionlint shellcheck lefthook

      - name: Enable pnpm (the version package.json's packageManager names)
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typos
        run: typos

      - name: Actionlint
        run: actionlint

      - name: Skills mirror
        run: just agents-check

      - name: Fetch crates (the core-boundary check reads cargo metadata offline)
        run: cargo fetch --locked

      - name: Script tests with coverage floors
        run: just test-scripts

      - name: Harness self-checks
        run: just check-harness

  macos:
    name: macOS Build & Smoke
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just aqua:nextest-rs/nextest/cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build fails when a bundle.externalBin file is missing, so the helper is
      # built before anything compiles the Tauri crate.
      - name: Build the sidecar helper
        run: just sidecar

      - name: Clippy (whole workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: macOS tests (tauri::test commands, real adapters)
        run: just test-macos

      - name: Build the debug app bundle
        run: just build

      - name: Launch smoke (release bundle, signature, entitlements, sidecar, smoke mode)
        run: just smoke

  bootstrap-smoke:
    # Template-only: scripts/bootstrap.ts removes this job, and its required context in
    # .github/rulesets/main.json, from every app it generates. A hyphenated
    # multi-word slug exercises every spelling the rename writes: tide-pool-core,
    # tide_pool_lib, and TIDE_POOL_SMOKE.
    name: Template Bootstrap Smoke
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the local clone below is made from a non-shallow source.
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node just github:taiki-e/cargo-llvm-cov aqua:nextest-rs/nextest/cargo-nextest shellcheck typos actionlint lefthook

      - name: Clone the checkout into a scratch directory
        run: |
          git clone --quiet --no-hardlinks . "$RUNNER_TEMP/bootstrap-smoke"
          mise trust "$RUNNER_TEMP/bootstrap-smoke/mise.toml"

      - name: Install dependencies in the clone
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Verify the bootstrap on a scratch copy (fails on any leftover placeholder)
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        # Before the bootstrap below, which deletes this script. The bootstrap itself only
        # warns about a placeholder outside its site list; this is the step that fails.
        run: node scripts/verify-bootstrap.ts

      - name: Bootstrap the clone non-interactively
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        run: |
          node scripts/bootstrap.ts --yes \
            --name "Tide Pool" --slug tide-pool --bundle-id com.example.tide-pool \
            --repo example-owner/tide-pool --author "Template Smoke" --copyright "Template Smoke"
          # The rename changed package.json's name, and pnpm runs nothing until the next
          # install (the bootstrap's next steps say `just install`).
          pnpm install --frozen-lockfile

      - name: The Product-section check fires on the unfilled app
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        run: |
          # An app nobody has described yet must fail the harness: AGENTS.md's Product
          # section still holds the template's TODO skeleton.
          if out="$(just check-harness 2>&1)"; then
            printf '%s\n' "$out"
            echo "::error::just check-harness passed on a bootstrapped app whose Product section is unfilled"
            exit 1
          fi
          printf '%s\n' "$out"
          if ! grep -q '^ERR_CHECK_PRODUCT_SECTION: ' <<<"$out"; then
            echo "::error::just check-harness failed, but not with ERR_CHECK_PRODUCT_SECTION"
            exit 1
          fi

      - name: Unit tests pass on the unfilled app
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        # No test may read the real checkout's Product section: an app runs `just
        # test-scripts` before anyone has described it.
        run: just test-scripts

      - name: Fill in only the Product section's four bullets
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        run: |
          # Each "- **Label** — TODO: …" bullet keeps its label and loses its indented
          # continuation lines; every other line, the section's introduction included,
          # stays as the bootstrap left it, so this proves filling the bullets is enough.
          awk '
            /^## / { inside = ($0 == "## Product"); bullet = 0; print; next }
            inside && /^- \*\*/ {
              sub(/\*\* — .*/, "** — a stand-in answer for the Template Bootstrap Smoke job.")
              print
              bullet = 1
              next
            }
            inside && bullet && /^  / { next }
            { bullet = 0; print }
          ' AGENTS.md >"$RUNNER_TEMP/AGENTS.md"
          mv "$RUNNER_TEMP/AGENTS.md" AGENTS.md

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/bootstrap-smoke -> target

      - name: just check in the bootstrapped app
        working-directory: ${{ runner.temp }}/bootstrap-smoke
        run: just check

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor is pinned in mise.toml (Renovate bumps it), not taken from a third-party action.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: zizmor

      - name: zizmor
        env:
          # Read-only: lets the online audits (known-vulnerable actions, impostor commits) run.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .
