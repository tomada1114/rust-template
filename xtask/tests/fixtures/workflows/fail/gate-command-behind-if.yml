# A gate CI runs as its recipe's line verbatim (`cargo fmt --all --check`), only behind
# an `if:`.
expect:
  workflow-hygiene: []
  just-check-matches-ci: [ERR_CHECK_JUST_CI_DIVERGED]
edits:
  - file: .github/workflows/ci.yml
    from: "      - run: cargo fmt --all --check\n"
    to: "      - if: github.ref == 'refs/heads/main'\n        run: cargo fmt --all --check\n"
