name: Bug Report
description: Report a bug or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for taking the time to report a bug. Please fill in as much detail as you
        can. For a security vulnerability, do not open an issue: follow SECURITY.md instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `myapp ...` (or open `myapp tui` and press ...)
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Version
      description: Output of `myapp --version`, and the commit you built from (`git rev-parse --short HEAD` in the checkout you installed from).
      placeholder: "myapp 0.1.0 (abc1234)"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System
      description: >
        macOS: output of `sw_vers -productVersion`. Linux: the distribution and version
        (`PRETTY_NAME` in `/etc/os-release`). Include the terminal you ran it in when the
        problem is in `myapp tui`.
      placeholder: "macOS 26.0, Terminal"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Excerpt
      description: >
        The lines around the problem from the newest log file: in
        `~/Library/Logs/com.example.myapp/` on macOS, or `$XDG_STATE_HOME/myapp/logs/`
        (by default `~/.local/state/myapp/logs/`) on Linux. `just logs` prints them from
        a checkout. Remove anything personal before pasting.
      render: text
    validations:
      required: false
