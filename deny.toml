# cargo-deny: advisories, licences, bans, sources.
# https://embarkstudios.github.io/cargo-deny/ (checked 2026-09-28)

[graph]
# What ships. Cargo.lock lists every platform's dependencies, and Tauri's Linux stack
# (the GTK bindings) carries advisories for code this macOS-only app never builds.
# Setting the target defines what is shipped; it ignores nothing within it.
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
# Unmaintained-crate advisories count for crates the workspace depends on directly;
# a transitive one is Tauri's to replace.
unmaintained = "workspace"
yanked = "deny"
# An advisory may be ignored only when no fixed release exists, with its reason, a
# 90-day review date in the comment, and a tracking issue. None today.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences only (.claude/rules/project.md): the ones the crates use today
# (cargo deny warns on an allowed licence nothing uses). dependency-review.yml's
# allow-licenses is this list plus BSD-2-Clause and ISC, which npm packages use; a crate
# that needs one of those is added here in the same PR.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# MPL-2.0 is file-level copyleft: fine to ship unmodified, but not permissive, so it is
# allowed only for the crates that reach the app through Tauri itself (tauri-utils'
# HTML handling and `dirs`), never globally.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies without a version.
allow-wildcard-paths = true
deny = [
  # Only the Tauri shell may depend on tauri directly. An app that adds a Tauri
  # plugin crate lists it here with the same wrapper.
  { crate = "tauri", wrappers = ["myapp"] },
  # Only the shell and the helper wire the real adapters; core never does.
  { crate = "myapp-platform", wrappers = ["myapp", "myapp-cli"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
