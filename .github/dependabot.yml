version: 2
# Weekly, with a 7-day cooldown equal to Renovate's and pnpm's minimumReleaseAge (a
# harness check keeps the three equal). Minor and patch updates arrive grouped; a major
# stays out of every group and gets its own PR, reviewed against its migration notes
# (merging-dependency-prs). Dependabot reads a 0.x minor as a minor, so such a bump
# rides in a group; the survey marks it (major). The Tauri family has its own group in
# each ecosystem, listed first because a dependency joins the first group it matches:
# a Tauri minor therefore holds only those two PRs, which merging-dependency-prs
# combines, because a harness check requires both sides on one minor.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps:"
    labels:
      - "dependencies"
    groups:
      cargo-tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps:"
    labels:
      - "dependencies"
    groups:
      npm-tauri:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci:"
    labels:
      - "dependencies"
    groups:
      # One upstream release pinned in several workflows (codeql-action's init,
      # analyze, and upload-sarif) arrives as one PR.
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
