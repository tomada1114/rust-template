[package]
name = "myapp-core"
description = "MyApp's domain logic: state, rules, and the ports adapters implement. No OS APIs, no terminal, no direct I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only platform-neutral crates belong here: a harness check fails if this crate's
# normal or build dependency closure reaches a crate AGENTS.md › Architecture forbids
# (an OS binding crate, a desktop-GUI crate, or myapp-platform).
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
myapp-test-support = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
