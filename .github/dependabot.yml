version: 2
# Weekly, with a 7-day cooldown equal to Renovate's minimumReleaseAge (a harness check
# keeps the two equal). Minor and patch updates arrive grouped; a major
# stays out of every group and gets its own PR, reviewed against its migration notes
# (merging-dependency-prs). Dependabot reads a 0.x minor as a minor, so such a bump
# rides in a group; the survey marks it (major).
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps:"
    labels:
      - "dependencies"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci:"
    labels:
      - "dependencies"
    groups:
      # One upstream release pinned in several workflows (codeql-action's init,
      # analyze, and upload-sarif) arrives as one PR.
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
