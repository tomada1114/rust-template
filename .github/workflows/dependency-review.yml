name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # The allow-list mirrors deny.toml's (permissive licences) for every ecosystem in
        # the dependency graph: crates and the actions a workflow uses.
        # - fail-on-severity is unset: its default, `low`, is the strictest.
        # - allow-ghsas lists exactly osv-scanner.toml's GHSA ignores
        #   (xtask/src/check_harness/advisory_ignores_agree.rs), none today.
        with:
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT, MIT-0, Unicode-3.0, Unlicense, Zlib
