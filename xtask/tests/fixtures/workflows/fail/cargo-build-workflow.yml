# A release workflow whose `cargo build` has no `--locked`.
expect:
  workflow-hygiene: [ERR_CHECK_WORKFLOW_UNLOCKED]
  just-check-matches-ci: []
files:
  .github/workflows/release.yml: |
    name: Release
    on:
      push:
        tags: ["v*"]
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    jobs:
      release:
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
          contents: read
        steps:
          - uses: ./.github/actions/setup
          - run: cargo build --release --target aarch64-apple-darwin
