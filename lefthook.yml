# Local Git hooks. Check-only and fast: nothing here rewrites a file, and
# there is no clippy or test step — `just check` and CI run those (`cargo xtask` builds the
# xtask crate on its first run, and again after xtask/ changes). A `cargo xtask` job builds
# into `CARGO_TARGET_DIR=target/xtask`, its own target directory, so a commit never waits
# on the lock of a workspace build running in target/; lefthook runs every job from the
# repository root, where that relative path is safe (.cargo/config.toml says why the alias
# cannot carry it). Each job runs
# the same executable and flags as the matching `just` recipe, narrowed to the staged
# files, so a change cannot pass here and fail there. The one addition is the skills-mirror
# job's `--staged`: it judges the index about to be committed, where `just agents-check`
# judges the working tree.
#
# Installed by `just install` (`lefthook install`); `just verify-hooks` fails while it is
# missing. `git commit --no-verify` skips every job below; CI reruns all but the staged
# guard, which no CI job reruns over a pull request's diff (AGENTS.md's gaps).

pre-commit:
  # The commit that concludes a conflicted merge, or a `git commit` at a rebase stop,
  # carries a conflict resolution no hook has seen, so the hook runs for it (lefthook's
  # `merge` state is MERGE_HEAD present, `rebase` a rebase in progress). Only the style jobs
  # skip those states: the staged files then are everything the other side changed, which
  # they would re-lint slowly, and CI reruns both over the whole tree. The staged guard
  # and the skills mirror never skip — no CI job reruns the guard over a pull request's
  # diff, and a resolved skill conflict is where the mirror drifts. They judge what is
  # staged against HEAD, so a `reword` or a `git commit --amend` at an `edit` stop now runs
  # them too, over what that stop newly stages (nothing, for a reword). The guard reads
  # every staged blob through one `git cat-file --batch`, so a large merge costs one git
  # process, not one per file. `git rebase --continue` commits a resolution without running
  # pre-commit at all; see AGENTS.md's gaps.
  # xtask/tests/lefthook.rs runs this file's hook through real merge and rebase commits.
  parallel: true
  jobs:
    # Secret-shaped paths and credential-shaped content in the staged blobs (not the
    # working tree). No glob: it must see every staged file, whatever its extension.
    - name: staged guard
      run: CARGO_TARGET_DIR=target/xtask cargo xtask check-staged

    - name: rustfmt
      skip: [merge, rebase]
      glob: "*.rs"
      run: rustfmt --check {staged_files}

    - name: typos
      skip: [merge, rebase]
      run: typos --force-exclude {staged_files}

    # .claude/skills/ must stay a byte-for-byte copy of .agents/skills/ (`just agents-sync`).
    # --staged compares the index, not the working tree: staging an edited skill without
    # its synced mirror is drift even when both working copies match.
    - name: skills mirror
      glob: "{.agents/skills/**,.claude/skills/**}"
      run: CARGO_TARGET_DIR=target/xtask cargo xtask sync-agents --check --staged
