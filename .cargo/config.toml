# ts-rs settings for the IPC bindings (design D4).
[env]
# Core's export tests compile only with its `export-bindings` feature, which `just bindings`
# enables, passing its own fresh TS_RS_EXPORT_DIR (the environment overrides this file).
# This default is a path no directory can be created under, so a type marked with a bare
# `#[ts(export)]` fails its `export_bindings_*` test in `just test-core` instead of
# writing files beside the crate: gate it with `cfg_attr(feature = "export-bindings", …)`.
TS_RS_EXPORT_DIR = "/dev/null/ts-rs-export-runs-only-in-just-bindings"
# 64-bit integers export as `number`, not `bigint`: the UI never holds a value past 2^53.
TS_RS_LARGE_INT = "number"
