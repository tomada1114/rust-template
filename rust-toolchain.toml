# The one Rust pin (design D9). rustup reads this file, and so does mise's `rust` tool,
# which delegates to rustup — so mise.toml does not pin Rust a second time.
# Renovate's `rust-toolchain` manager opens the bump PRs.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt", "llvm-tools"]
targets = ["aarch64-apple-darwin"]
profile = "minimal"
