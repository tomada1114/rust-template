# The categories of the pull-request list `gh release create --generate-notes` appends
# to a release's notes, which start with CHANGELOG.md's section for the version
# (scripts/release-notes.ts). Every label scripts/label-pr.ts applies has a category
# here (a harness check keeps them agreeing). The last category, "*", catches a pull
# request with none of those labels (a fork pull request label-pr could not label, or
# one merged before `just labels`), so none is dropped.
changelog:
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Bug Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [chore]
    - title: Dependencies
      labels: [dependencies]
    - title: CI
      labels: [ci]
    - title: Other Changes
      labels: ["*"]
