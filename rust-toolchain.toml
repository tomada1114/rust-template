# The one Rust pin. rustup reads this file and installs the toolchain on the next
# `cargo` call (sourced in .claude/rules/project.md › Tool Pinning); mise.toml lists no
# `rust` tool, so `mise install` does not install Rust.
# Renovate's `rust-toolchain` manager opens the bump PRs.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt", "llvm-tools"]
targets = ["aarch64-apple-darwin"]
profile = "minimal"
