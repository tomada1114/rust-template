[files]
extend-exclude = [
  # The generated lockfile: a typo in a package name is upstream's.
  "Cargo.lock",
  # Build output, matching .gitignore.
  "target/",
  "coverage/",
  # Byte-identical to .claude/skills/ (`just agents-check`), which typos reads: the
  # tree Claude Code loads.
  ".agents/skills/",
]

[default.extend-words]
# The terminal UI crate's name, which typos otherwise reads as a misspelling of
# "ratatouille".
ratatui = "ratatui"
