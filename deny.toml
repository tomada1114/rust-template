# cargo-deny: advisories, licences, bans, sources.
# https://embarkstudios.github.io/cargo-deny/ (checked 2026-09-28)

[graph]
# What ships. Cargo.lock lists every platform's dependencies; setting the target defines
# what is shipped, and it ignores nothing within it.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
# Unmaintained-crate advisories count for crates the workspace depends on directly;
# a transitive one is its dependent's to replace.
unmaintained = "workspace"
yanked = "deny"
# An advisory may be ignored only when no fixed release exists, with its reason, a
# 90-day review date in the comment, and a tracking issue. None today.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences only (.claude/rules/project.md): the ones the crates use today
# (cargo deny warns on an allowed licence nothing uses). dependency-review.yml's
# allow-licenses is this list plus six more permissive licences no crate here uses yet
# (0BSD, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT-0); a crate that needs one of
# those is added here in the same PR.
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies without a version.
allow-wildcard-paths = true
deny = [
  # Only the binary wires the real adapters; core never does.
  { crate = "myapp-platform", wrappers = ["myapp"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
